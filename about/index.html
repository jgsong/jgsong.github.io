<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="../css/tailwind.css">

    <!-- Phosphor Icons -->
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />

    <!-- Favicon -->
    <link rel='icon' href='assets/img/favicon.ico' type='image/x-icon' />

    <title>James Song</title>
</head>

<body
    class="flex flex-col mx-auto bg-white max-w-(--breakpoint-lg) bg-[linear-gradient(to_right,#8080800a_1px,transparent_1px),linear-gradient(to_bottom,#8080800a_1px,transparent_1px)] bg-[size:14px_24px]">
    <header>
        <nav class="flex w-full justify-between bg-white border-b sm:border-x py-6 px-6 sm:px-16">
            <a id="logo"
                class="cursor-pointer text-lg font-semibold transition-[color] hover:ease-out duration-300 hover:text-[#E45D50]"
                href="">James Song</a>
            <div id="links" class="flex gap-4 items-end">
                <a class="cursor-pointer hover:text-emerald-800" href="">Work</a>
                <a class="cursor-pointer hover:text-emerald-800" href="../about">About</a>
            </div>
        </nav>
    </header>

    <main
        class="flex flex-col bg-white border-x max-w-none prose prose-stone prose-lg text-pretty py-6 px-6 sm:px-16 sm:py-16">
        <div id="hero">
            <h1>About Me</h1>
            <p></p>

        </div>
    </main>

    <footer class="flex justify-between px-8 py-8 border bg-white text-sm rounded-b-lg mb-8">
        <div id="left" class="">
            <p>Made by James with Tailwind CSS</p>
        </div>
        <div id="right" class="text-stone-500">
            © 2025
        </div>
    </footer>
</body>

</html>
